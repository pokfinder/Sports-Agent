name: NBA historical model audit
on:
  workflow_dispatch:
    inputs:
      offseason_retention:
        description: "Previous-season Elo retention, 0 to 1"
        required: false
        default: "1.0"
      start_date:
        description: "First historical date (YYYY-MM-DD)"
        required: false
        default: "2025-10-21"
      end_date:
        description: "Last historical date (YYYY-MM-DD, maximum 90 days)"
        required: false
        default: "2025-12-19"
permissions:
  contents: read
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Backtest on dated historical NBA games
        run: python -m scripts.backtest_nba --start "$START_DATE" --end "$END_DATE" --offseason-retention "$OFFSEASON_RETENTION"
        env:
          OFFSEASON_RETENTION: ${{ inputs.offseason_retention }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-historical-audit
          path: data/nba_backtest_report.json
          if-no-files-found: ignore
