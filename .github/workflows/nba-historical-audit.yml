name: NBA historical model audit
on:
  workflow_dispatch:
    inputs:
      offseason_retention:
        description: "Previous-season Elo retention, 0 to 1"
        required: false
        default: "1.0"
permissions:
  contents: read
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Backtest on dated historical NBA games
        run: python -m scripts.backtest_nba --start 2025-10-21 --end 2025-12-19 --offseason-retention "$OFFSEASON_RETENTION"
        env:
          OFFSEASON_RETENTION: ${{ inputs.offseason_retention }}
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-historical-audit
          path: data/nba_backtest_report.json
          if-no-files-found: ignore
