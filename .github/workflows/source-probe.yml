name: Free sports source probe
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/status.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sports-agent-snapshot
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m scripts.evaluate_demo
      - name: Probe sportsbook odds provider and publish snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m scripts.publish_status
      - name: Publish dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/status.json /tmp/sports-agent-status.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sports-agent-status.json docs/status.json
            git add docs/status.json
            if git diff --cached --quiet; then
              echo 'No snapshot changes'
              exit 0
            fi
            git commit -m 'Update Sports Agent dashboard snapshot [skip ci]'
            if git push origin HEAD:main; then
              echo 'Published snapshot successfully'
              exit 0
            fi
            echo "Concurrent update; retry $attempt of 5"
            sleep $((attempt * 2))
          done
          echo 'Snapshot publish failed after retries' >&2
          exit 1
